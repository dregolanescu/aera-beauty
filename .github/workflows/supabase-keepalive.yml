name: Supabase keep-alive

# Previne pauza automată a proiectului Supabase pe planul free.
#
# Istoric: prima versiune făcea un SELECT minimal de 2 ori pe săptămână.
# A rulat verde (HTTP 200) pe 16 și 20 iul 2026, dar Supabase a pauzat
# proiectul oricum pe 22 iul — un read pe un tabel gol e prea ieftin ca
# resurse și nu resetează contorul lor de "low activity".
#
# Versiunea asta face o SCRIERE reală (upsert), ZILNIC, într-o tabelă
# dedicată `keepalive` — ca să nu atingem niciodată datele GDPR din
# `precomenzi` / `colaborari`.
#
# Bonus: dacă proiectul e totuși pauzat, requestul pică și workflow-ul
# devine roșu — deci primești notificare de la GitHub, nu afli peste 3
# săptămâni dintr-un email de la Supabase.

on:
  schedule:
    - cron: '0 6 * * *' # Zilnic la 06:00 UTC
  workflow_dispatch: {} # Buton de rulare manuală din tab-ul Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert în tabela keepalive (activitate reală pe DB)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::Lipsesc secretele SUPABASE_URL sau SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(printf '{"id":1,"last_ping":"%s","source":"github-actions"}' "$NOW")

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/rest/v1/keepalive" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d "$BODY")

          HTTP=$(printf '%s' "$RESP" | tail -n1)
          PAYLOAD=$(printf '%s' "$RESP" | sed '$d')

          echo "HTTP status: $HTTP"
          echo "Răspuns: $PAYLOAD"

          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Keep-alive a eșuat (status $HTTP). Proiectul Supabase poate fi pe pauză."
            exit 1
          fi

          echo "Keep-alive OK — scriere confirmată în tabela keepalive."
